name: Build Kivy Android APK In Debug Mode

on:
  workflow_dispatch:

env:
  CYTHON_LANGUAGE_LEVEL: "3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  MAKEFLAGS: "-j1"          # 防止内存溢出

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # 超时自动终止
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # 缓存Buildozer全局工具链（SDK/NDK放在 ~/.buildozer，独立缓存）
    - name: Cache buildozer toolchain
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.android
        key: buildozer-kivymd-v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            curl libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.33

    - name: Pre-fetch p4a source and patch disable pip upgrade
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        export USE_COLORS=0
        # 执行buildozer，触发自动clone p4a，遇到准备阶段立刻终止（|| true 忽略报错）
        buildozer -v android debug --python=3.11 || true
        
        # p4a源码路径（项目内 .buildozer）
        P4A_BUILD="./.buildozer/android/platform/python-for-android/pythonforandroid/build.py"
        echo "Patching file: $P4A_BUILD"
        # 注释掉执行 pip install -U pip 的代码行
        sed -i '/pip install -U pip/s/^/#/' "$P4A_BUILD"

    - name: Build APK with Buildozer (patched)
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        echo "Java version:"
        java -version
        echo "Python version:"
        python --version
        buildozer --version
        
        export USE_COLORS=0
        buildozer -v android debug --python=3.11 2>&1 | tee buildozer.log

    - name: Check if APK generated
      id: check-build
      run: |
        if [ -d bin ] && ls bin/*.apk 1> /dev/null 2>&1; then
          echo "BUILD_FINAL_SUCCESS=true" >> $GITHUB_OUTPUT
          ls -la bin/
        else
          echo "BUILD_FINAL_SUCCESS=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK artifact
      if: steps.check-build.outputs.BUILD_FINAL_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kivymd-debug-apk
        path: bin/*.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: buildozer.log
        retention-days: 7
